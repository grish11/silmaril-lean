name: Rust checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  silmaril-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/silmaril-project
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: Restore the Cargo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            tools/silmaril-project/target
          key: cargo-v1-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('tools/silmaril-project/Cargo.lock') }}
          restore-keys: cargo-v1-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests (unit tests and the golden cases)
        run: cargo test --locked

  wasm-acceptor-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: tools/wasm-acceptor-harness
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: Restore the Cargo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            tools/wasm-acceptor-harness/target
          key: cargo-v1-harness-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('tools/wasm-acceptor-harness/Cargo.lock') }}
          restore-keys: cargo-v1-harness-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --release --all-targets -- -D warnings
      # Value conversion by WIT type (through a generated component), CIDs, verdicts and the
      # suite files' parsing.
      - name: Unit tests
        run: cargo test --locked --release
      # The fixed command of `make acceptor-report`; the explorer shows the committed report
      # (make pages copies it to acceptor-runs.json), so it must be what this run observes.
      - name: Run the suites under Wasmtime (actual component bytes)
        working-directory: .
        run: make acceptor-report
      - name: The committed report is this run's
        run: |
          if ! git diff --exit-code -- report.json; then
            echo "tools/wasm-acceptor-harness/report.json differs from this run: run 'make acceptor-report' and commit it" >&2
            exit 1
          fi
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-acceptor-report
          path: tools/wasm-acceptor-harness/report.json
          if-no-files-found: warn
