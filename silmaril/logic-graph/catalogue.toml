# The curated catalogue the logic-graph port started from (137 logics, 158 maps between them),
# entry by entry: what each entry is in this repository. Generated from the registry and the Lean
# evidence; `silmaril logic_catalogue` checks that every evidence declaration exists.
#   registered             the entry is a registered record (its evidence declaration, or a named
#                          bundle of it, is the record's declaration)
#   represented            the entry is an instance or an endpoint of registered records
#   not-institution-typed  the evidence is a logical system, proof calculus, translation of proofs,
#                          family of institutions or theorem: outside the five registry kinds
#   prospective            the catalogue entry has no Lean declaration
schema = "silmaril.records.v0.2"

