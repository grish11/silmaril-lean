name = "openssl"
version = "3.5.9"
category = "TLS/crypto library (libcrypto), TLS library (libssl), crypto command-line tool"
summary = "OpenSSL 3.5.9 (3.5 LTS, latest patch release on 2026-11-17), built with its own Configure + make, no-asm (pure C: no perlasm modules) shared no-tests: libcrypto.so.3, libssl.so.3 and the openssl CLI (apps/openssl) as separate ELF files."
license = "Apache-2.0"
license_files = ["upstream/openssl-3.5.9/LICENSE.txt"]
homepage = "https://openssl-library.org/"

[[archive]]
url = "https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz"
sha256 = "603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a"
root = "openssl-3.5.9"
retrieved = "2026-11-17"
notes = "sha256 equals the published https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz.sha256 (no PGP check done)."

[[object]]
name = "libcrypto.so.3"
kind = "shared"
sources_list = "upstream/openssl-3.5.9/crypto/**, providers/** (C files named in the depfiles; generated ones in generated/<arch>/)"
cflags = "-fPIC -pthread -m64 (x86_64 only) -O2 -g0 -ffile-prefix-map=/build/openssl=. -DOPENSSL_USE_NODELETE -DL_ENDIAN -DOPENSSL_PIC -DOPENSSLDIR=\"/usr/local/ssl\" -DENGINESDIR=... -DMODULESDIR=... -DOPENSSL_BUILDING_OPENSSL -DNDEBUG -MMD (exact lines: receipt.json build_commands)"
notes = "./Configure linux-x86_64|linux-aarch64 --cross-compile-prefix=aarch64-linux-gnu- no-asm shared no-tests --prefix=/usr/local --openssldir=/usr/local/ssl --libdir=lib CFLAGS='-O2 -g0 -ffile-prefix-map=/build/openssl=.'; make build_libs. The default provider and the base provider are built into libcrypto; the legacy provider module is not built."

[[object]]
name = "libssl.so.3"
kind = "shared"
sources_list = "upstream/openssl-3.5.9/ssl/** (C files named in the depfiles)"
cflags = "as libcrypto.so.3"

[[object]]
name = "openssl"
kind = "exe"
sources_list = "upstream/openssl-3.5.9/apps/** (apps/*.c, apps/lib/*.c; generated apps/progs.c, apps/progs.h in generated/<arch>/)"
cflags = "-pthread -m64 (x86_64 only) -O2 -g0 -ffile-prefix-map=/build/openssl=. -DL_ENDIAN -DOPENSSL_BUILDING_OPENSSL -DNDEBUG -MMD (no -fPIC; PIE by Debian gcc default)"
notes = "make apps/openssl; DT_NEEDED libssl.so.3 libcrypto.so.3."
