[[object]]
name = "libref_sha2.so"
kind = "shared"
sources = ["generated/x86_64/rfc6234/sha1.c", "generated/x86_64/rfc6234/sha224-256.c", "generated/x86_64/rfc6234/sha384-512.c", "generated/x86_64/rfc6234/usha.c", "generated/x86_64/rfc6234/hmac.c", "generated/x86_64/rfc6234/hkdf.c"]
cflags = "-O2 -g0 -ffile-prefix-map=/build/refcrypto=. -fPIC -MMD -Irfc6234"
notes = "SHA-1, SHA-224/256, SHA-384/512, USHA, HMAC, HKDF exactly as printed in RFC 6234 section 8 (same files in generated/aarch64/)."

[[object]]
name = "libref_sha3.so"
kind = "shared"
sources = ["upstream/XKCP-d20c8fcaecc543f816a0721d0dfc13b4cf27c14d/Standalone/CompactFIPS202/C/Keccak-readable-and-compact.c"]
cflags = "-O2 -g0 -ffile-prefix-map=/build/refcrypto=. -fPIC -MMD"
notes = "LITTLE_ENDIAN not defined (portable byte-wise load/store path)."

[[object]]
name = "libref_blake2.so"
kind = "shared"
sources = ["upstream/BLAKE2-ed1974ea83433eba7b2d95c5dcd9ac33cb847913/ref/blake2b-ref.c", "upstream/BLAKE2-ed1974ea83433eba7b2d95c5dcd9ac33cb847913/ref/blake2s-ref.c"]
cflags = "-O2 -g0 -ffile-prefix-map=/build/refcrypto=. -fPIC -MMD -I<BLAKE2>/ref"

[[object]]
name = "libref_aes.so"
kind = "shared"
sources = ["upstream/rijndael-fst-3.0/rijndael-alg-fst.c"]
cflags = "-O2 -g0 -ffile-prefix-map=/build/refcrypto=. -fPIC -MMD -Irijndael-fst-3.0"
notes = "INTERMEDIATE_VALUE_KAT not defined (exports rijndaelKeySetupEnc/Dec, rijndaelEncrypt/Decrypt)."

[[object]]
name = "libref_chacha_poly.so"
kind = "shared"
sources = ["upstream/supercop-20261018/crypto_stream/chacha20/e/ref/api.c", "upstream/supercop-20261018/crypto_stream/chacha20/e/ref/e/chacha.c", "upstream/poly1305-donna-e6ad6e091d30d7f4ec2d4f978be1fcfcbce72781/poly1305-donna.c"]
cflags = "-O2 -g0 -ffile-prefix-map=/build/refcrypto=. -fPIC -MMD -I<chacha20/e/ref> -I<supercop>/include -I<supercop>/cryptoint -I/corpus/refcrypto/local/supercop-shim/chacha20 -I<poly1305-donna>"
notes = "api.c (include/estream-convert-api.h: crypto_stream wrappers) + e/chacha.c (DJB chacha-ref, 64-bit nonce + 64-bit counter); exports crypto_stream_chacha20{,_xor} and crypto_stream_chacha20_e_ref_ECRYPT_*; poly1305-donna exports poly1305_init/update/finish/auth/verify."

[[object]]
name = "libref_ed25519.so"
kind = "shared"
sources_list = "upstream/ed25519-b1f19fab4aebe607805620d25a5e42566ce46a0e/src/{add_scalar,fe,ge,key_exchange,keypair,sc,seed,sha512,sign,verify}.c"
cflags = "-O2 -g0 -ffile-prefix-map=/build/refcrypto=. -fPIC -MMD -I<ed25519>/src"

[[object]]
name = "libref_x25519.so"
kind = "shared"
sources_list = "upstream/supercop-20261018/crypto_scalarmult/curve25519/ref10/{scalarmult,base,fe_0,fe_1,fe_add,fe_copy,fe_cswap,fe_frombytes,fe_invert,fe_mul,fe_mul121666,fe_sq,fe_sub,fe_tobytes}.c"
cflags = "-O2 -g0 -ffile-prefix-map=/build/refcrypto=. -fPIC -MMD -I<curve25519/ref10> -I<supercop>/cryptoint -I/corpus/refcrypto/local/supercop-shim/x25519"
notes = "exports crypto_scalarmult_curve25519{,_base}; internal fe_* are crypto_scalarmult_curve25519_ref10_fe_*."
