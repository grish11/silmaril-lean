# Wasm specification library entry (format: docs/projects/wasm-spec-library.md).
schema = 1
name = "Adder"
version = "1.0.0"
summary = "Wrapping 32-bit addition: `add x y = x + y (mod 2^32)`."
status = "verified"

[program]
kind = "annotated-wat"
source = "adder.wat"
lean = "Silmaril.WasmSpec.Adder.program"
module = "Silmaril.WasmSpec.Adder.Defs"
functions = ["add"]

[spec]
module = "Silmaril.WasmSpec.Adder.Defs"
statements = ["Silmaril.WasmSpec.Adder.Spec", "Silmaril.WasmSpec.Adder.CallSpec"]
description = """
`Spec`: for all x y : BitVec 32, the body of `$add` called on [i32 x, i32 y]
can return exactly [i32 (x + y)] without changing the store, in every profile,
host, store and module instance (`Computes`). `CallSpec P host a Inv`: the
function at address `a` does the same through any call form (`PureSpec`)."""
runs = "some"
correctness = "total"

[results]
module = "Silmaril.WasmSpec.Adder.Thms"
theorems = ["Silmaril.WasmSpec.Adder.spec", "Silmaril.WasmSpec.Adder.callSpec"]

[[solution]]
mode = "tactic"
theorem = "Silmaril.WasmSpec.Adder.spec_tactic"
proves = "Silmaril.WasmSpec.Adder.Spec"
module = "Silmaril.Proofs.WasmSpec.Adder.Tactic"
axioms = ["propext", "Classical.choice", "Quot.sound"]
tools = { lean = "v4.35.0-rc4" }
check_seconds = 1.3
notes = "rw the quoted body to its instruction list; wasm_step; simp."

[[solution]]
mode = "tactic+script"
theorem = "Silmaril.WasmSpec.Adder.Script.spec_script"
proves = "Silmaril.WasmSpec.Adder.Spec"
module = "Silmaril.Proofs.WasmSpec.Adder.Script"
axioms = ["propext", "Classical.choice", "Quot.sound"]
tools = { lean = "v4.35.0-rc4", wasm-vc = "0.1.0", z3 = "4.16.0" }
check_seconds = 2.0
generator = { tool = "tools/wasm-vc", version = "0.1.0", command = "cargo run --manifest-path tools/wasm-vc/Cargo.toml -- gen Silmaril/WasmSpec/Adder", outputs = ["Silmaril/Proofs/WasmSpec/Adder/Script.lean"] }
notes = "Conditions from symbolic execution of the annotated WAT (vc.toml); z3 checked them and its unsat cores chose the hints; tactics chosen by trying candidates in Lean."
