# wasm-sim: runtime harness, translators, difftests and benchmarks for the ISA simulators
# in Wasm (docs/wasm-sim-abi.md). Standalone crate:
# library `src/lib.rs` (harness, x86, proc/sysv, reduce); binary `wasm-sim` (src/main.rs).
[package]
name = "wasm-sim"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "wasmtime harness for the Wasm ISA simulators (docs/wasm-sim-abi.md)"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "wat", "std", "cache", "parallel-compilation", "anyhow"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "encoder", "code_asm", "gas", "instr_info"] }
libc = "0.2"
wat = "1"
wasmparser = "0.263"
wasm-encoder = "0.263"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"

[[bin]]
name = "wasm-sim"
path = "src/main.rs"

[profile.release]
debug = false
